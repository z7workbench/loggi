[workspace]
resolver = "2"
members = [
    "crates/engine",
    "crates/cli",
    "crates/mcp",
    "crates/bench",
    "crates/engine-jni",
]

[workspace.package]
# Cargo requires full semver (x.y.z); the displayed/packaged version trims
# trailing ".0" components (see desktopApp/build.gradle.kts trimVersion).
version = "1.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
loggi-engine = { path = "crates/engine" }
memchr = "2"
roaring = "0.10"
rayon = "1"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
xxhash-rust = { version = "0.8", features = ["xxh64"] }
encoding_rs = "0.8"
chardetng = "0.1"
thiserror = "2"

[profile.release]
lto = true
codegen-units = 1

[profile.bench]
lto = true
codegen-units = 1
