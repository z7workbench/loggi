name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx3g

jobs:
  rust:
    name: Rust (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Cache cargo registry + target
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "crates/engine crates/engine-jni -> target"
      - name: Format
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace

  desktop:
    name: Desktop build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: jetbrains
          java-version: "21"
        env:
          GITHUB_TOKEN: ${{ secrets.ACCESS_TOKEN }}
      - uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo registry + target
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "crates/engine crates/engine-jni -> target"
      - name: Cache Gradle
        uses: gradle/actions/setup-gradle@v6
      - name: Compose desktop compile
        run: ./gradlew compileKotlinJvm compileTestKotlinJvm compileKotlin --console=plain

  desktop-smoke:
    name: JVM bridge smoke test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-java@v5
        with:
          distribution: jetbrains
          java-version: "21"
        env:
          GITHUB_TOKEN: ${{ secrets.ACCESS_TOKEN }}
      - name: Cache cargo registry + target
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "crates/engine crates/engine-jni -> target"
      - name: Cache Gradle
        uses: gradle/actions/setup-gradle@v6
      # M11: the OS-specific FileAssociation helpers (Windows verb,
      # Linux .desktop) are exercised as part of the JVM bridge tests so a
      # broken platform-specific path fails the build.
      - name: JVM tests (builds the JNI cdylib via cargo)
        run: ./gradlew :shared:jvmTest --console=plain

  perf-gate:
    name: Perf gate (literal search / index throughput)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo registry + target
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "crates/bench -> target"
      - name: Perf gate
        run: cargo run --release -p loggi-bench --bin perf-gate
