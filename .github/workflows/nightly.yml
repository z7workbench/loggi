name: Nightly

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

jobs:
  soak:
    name: Soak + full bench matrix
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Generate 1 GiB corpus
        run: cargo run --release -p loggi-bench --bin gen-log -- 1g repeat /tmp/soak-1g.log
      - name: Soak (200 cycles)
        run: cargo run --release -p loggi-bench --bin soak -- /tmp/soak-1g.log 200
      - name: Full criterion suite
        run: cargo bench -p loggi-bench
      - name: Perf gate
        run: cargo run --release -p loggi-bench --bin perf-gate
